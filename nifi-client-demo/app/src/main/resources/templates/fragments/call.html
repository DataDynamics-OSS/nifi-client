<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>

<!--/*
  SdkCall 하나의 결과: 실행한 클라이언트 코드, 그리고 결과나 예외.
  htmx 요청에 답하는 컨트롤러는 모델 속성 "call"을 넣고 "fragments/call :: call"을 돌려줍니다. 이 조각에는 그 동작에서
  보낸 요청 목록(actionTrace)도 붙습니다. 화면에 넣을 때는 th:replace="~{fragments/call :: panel(${someCall})}".
*/-->
<div th:fragment="call">
    <section th:replace="~{fragments/call :: panel(${call})}"></section>
    <section th:replace="~{fragments :: actionTrace}"></section>
</div>

<section th:fragment="panel(c)" class="call" th:classappend="${c.ok()} ? 'ok' : 'err'" th:if="${c != null}">
    <div class="call-head">
        <span class="badge" th:classappend="${c.ok()} ? 'ok' : 'err'" th:text="${c.ok()} ? '성공' : '실패'">성공</span>
        <span class="muted small" th:text="${c.elapsedMs()} + ' ms · HTTP 요청 ' + ${#lists.size(c.attempts())} + '건'"></span>
    </div>
    <pre class="code" data-lang="java" th:text="${c.code()}">processors.getProcessor(id)</pre>
    <th:block th:unless="${c.ok()}"><div th:replace="~{fragments :: failure(${c.failure()})}"></div></th:block>
    <details th:if="${c.ok() and c.result() != null}" th:open="${resultOpen != null ? resultOpen : true}">
        <summary th:text="'결과: ' + ${c.resultType()}">결과</summary>
        <pre class="code" data-lang="json" th:text="${@json.pretty(c.result())}"></pre>
    </details>
    <p class="muted small" th:if="${c.ok() and c.result() == null}">반환값 없음 (void)</p>
</section>

</body>
</html>
