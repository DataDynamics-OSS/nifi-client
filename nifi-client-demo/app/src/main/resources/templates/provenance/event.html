<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments :: head('프로비넌스 이벤트')}"></head>
<body>
<header th:replace="~{fragments :: nav('provenance')}"></header>
<div class="layout">
<main>
    <p class="small"><a th:href="@{/provenance}">&larr; 프로비넌스</a></p>
    <h1 th:text="${event != null} ? '이벤트 ' + ${event.getEventId()} + ' · ' + ${event.getEventType()} : '프로비넌스 이벤트'"></h1>
    <div th:replace="~{fragments/call :: panel(${get})}"></div>

    <th:block th:if="${event != null}">
        <section class="panel">
            <dl class="kv">
                <dt>시각</dt><dd th:text="${event.getEventTime()}"></dd>
                <dt>컴포넌트</dt><dd><a th:href="@{/processors/{id}(id=${event.getComponentId()})}" th:text="${event.getComponentName()}"></a>
                    <span class="small muted" th:text="${event.getComponentType()}"></span></dd>
                <dt>FlowFile</dt><dd><code th:text="${event.getFlowFileUuid()}"></code></dd>
                <dt>크기</dt><dd th:text="${event.getFileSize()}"></dd>
                <dt>관계</dt><dd th:text="${event.getRelationship()}"></dd>
                <dt>세부</dt><dd th:text="${event.getDetails()}"></dd>
            </dl>
            <h4>속성 (이벤트 시점)</h4>
            <table>
                <thead><tr><th>이름</th><th>값</th><th>이전 값</th></tr></thead>
                <tr th:each="a : ${event.getAttributes()}" th:classappend="${a.getPreviousValue() != a.getValue()} ? 'changed'">
                    <td><code th:text="${a.getName()}"></code></td>
                    <td class="small" th:text="${a.getValue()}"></td>
                    <td class="small muted" th:text="${a.getPreviousValue() != a.getValue()} ? ${a.getPreviousValue()} : ''"></td>
                </tr>
            </table>
        </section>
        <section class="panel">
            <h3>내용 <code class="small">getOutputContentCall</code></h3>
            <p class="muted small">이벤트 시점의 내용은 NiFi의 내용 저장소에 남아 있을 때만 받을 수 있습니다(오래된 것은 지워짐).</p>
            <div class="actions">
                <button th:disabled="${!event.isOutputContentAvailable()}" th:attr="hx-post=@{/provenance/events/{id}/content(id=${event.getEventId()},side='output')}" hx-target="#result">출력 내용</button>
                <button class="secondary" th:disabled="${!event.isInputContentAvailable()}" th:attr="hx-post=@{/provenance/events/{id}/content(id=${event.getEventId()},side='input')}" hx-target="#result">입력 내용</button>
            </div>
            <div id="result"></div>
        </section>
    </th:block>
    <section th:replace="~{fragments :: trace}"></section>
</main>
<aside class="help" th:replace="~{help/provenance :: help}"></aside>
</div>
</body>
</html>
