# 통합 테스트용 NiFi 1.28.1 (no auth / HTTPS single-user 로그인)
services:
  nifi-http:
    image: apache/nifi:1.28.1
    ports: ["127.0.0.1:38080:38080"]
    environment:
      NIFI_WEB_HTTP_PORT: "38080"
  nifi-https:
    image: apache/nifi:1.28.1
    ports: ["127.0.0.1:38443:38443"]
    environment:
      NIFI_WEB_HTTPS_PORT: "38443"
      NIFI_WEB_PROXY_HOST: "localhost:38443"
      SINGLE_USER_CREDENTIALS_USERNAME: "admin"
      SINGLE_USER_CREDENTIALS_PASSWORD: "ctsBtRBKHRAx69EqUghvvgEvjnaLjFEB"
